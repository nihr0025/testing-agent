<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle for standout contrast on dark/light tabs -->
  <rect width="64" height="64" rx="14" fill="#0B1120" />
  
  <!-- Outer 6-node agent ring hints -->
  <polygon points="32,8 52,19 52,45 32,56 12,45 12,19" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="2 2" fill="none" />
  
  <!-- Checkmark Trace -->
  <path d="M 16 31 L 28 46 L 50 16" stroke="url(#favGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Six Key Agent Node Pins -->
  <circle cx="32" cy="8" r="2.5" fill="#06B6D4" />
  <circle cx="52" cy="19" r="2.5" fill="#8B5CF6" />
  <circle cx="52" cy="45" r="2.5" fill="#7C3AED" />
  <circle cx="32" cy="56" r="2.5" fill="#2563EB" />
  <circle cx="12" cy="45" r="2.5" fill="#3B82F6" />
  <circle cx="12" cy="19" r="2.5" fill="#06B6D4" />
</svg>
