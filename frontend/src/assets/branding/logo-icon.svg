<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="traceGrad" x1="18%" y1="60%" x2="84%" y2="20%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.35" />
    </linearGradient>
    <radialGradient id="apexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Node Glow -->
  <circle cx="50" cy="50" r="42" fill="url(#orbitGrad)" opacity="0.08" />

  <!-- 6-Agent Interconnection Web (Traceability Mesh) -->
  <polygon points="50,14 82,32 82,68 50,86 18,68 18,32" 
           stroke="url(#orbitGrad)" stroke-width="1.75" stroke-dasharray="3.5 3.5" fill="none" />
  
  <!-- Internal Cross-Agent Neural Links -->
  <line x1="50" y1="14" x2="50" y2="86" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2" />
  <line x1="18" y1="32" x2="82" y2="68" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2" />
  <line x1="18" y1="68" x2="82" y2="32" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2" />

  <!-- Secondary Echo Pulse (Traceability Path) -->
  <path d="M 26 47 L 43 65 L 75 28" 
        stroke="#06B6D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.4" />

  <!-- Primary Dynamic QA Validation Checkmark -->
  <path d="M 23 48 L 43 72 L 81 22" 
        stroke="url(#traceGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 6 Collaborative AI Agent Nodes -->
  <!-- Agent 1: Requirement Analysis -->
  <circle cx="50" cy="14" r="3.75" fill="#06B6D4" stroke="#FFFFFF" stroke-width="1.5" />
  <!-- Agent 2: Scenario Generation -->
  <circle cx="82" cy="32" r="3.75" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.5" />
  <!-- Agent 3: Test Case Design -->
  <circle cx="82" cy="68" r="3.75" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5" />
  <!-- Agent 4: Automation Scripting -->
  <circle cx="50" cy="86" r="3.75" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5" />
  <!-- Agent 5: Execution Engine -->
  <circle cx="18" cy="68" r="3.75" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5" />
  <!-- Agent 6: Reporting & Audit -->
  <circle cx="18" cy="32" r="3.75" fill="#06B6D4" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Terminal Validation Sparkle at Checkmark Apex -->
  <circle cx="81" cy="22" r="2.25" fill="#FFFFFF" />
</svg>
