<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" fill="none">
  <defs>
    <linearGradient id="traceGradLight" x1="18%" y1="60%" x2="84%" y2="20%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="orbitGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Group: Icon Symbol (scaled & positioned in 60x60 square) -->
  <g transform="translate(6, 6) scale(0.48)">
    <polygon points="50,14 82,32 82,68 50,86 18,68 18,32" 
             stroke="url(#orbitGradLight)" stroke-width="2.5" stroke-dasharray="4 4" fill="none" />
    <line x1="50" y1="14" x2="50" y2="86" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.2" />
    <line x1="18" y1="32" x2="82" y2="68" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.2" />
    <line x1="18" y1="68" x2="82" y2="32" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.2" />
    <path d="M 23 48 L 43 72 L 81 22" 
          stroke="url(#traceGradLight)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="14" r="4.5" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="82" cy="32" r="4.5" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="82" cy="68" r="4.5" fill="#6D28D9" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="50" cy="86" r="4.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="18" cy="68" r="4.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="18" cy="32" r="4.5" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Typography -->
  <!-- "TraceAI" (Primary Emphasis) -->
  <text x="64" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">
    Trace<tspan fill="#2563EB">AI</tspan>
  </text>
  <!-- "STUDIO" (Secondary Subtitle) -->
  <text x="64" y="47" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" letter-spacing="0.22em">
    STUDIO
  </text>
  <!-- Badge: 6-Agent Verified indicator -->
  <rect x="146" y="18" width="58" height="16" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
  <text x="175" y="29.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#1D4ED8" letter-spacing="0.04em">
    6-AGENTS
  </text>
</svg>
